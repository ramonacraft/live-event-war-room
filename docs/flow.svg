<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">Live Event War Room flow</title>
  <desc id="desc">Release Gate and Player probe feed Event health, then Scenarios, with Runbook in parallel.</desc>

  <rect width="980" height="260" fill="#0f172a" rx="16"/>

  <text x="140" y="34" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1. Real signals</text>
  <text x="520" y="34" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">2. Live board</text>
  <text x="840" y="34" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">3. Living runbook</text>

  <rect x="40" y="64" width="200" height="52" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="96" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Release Gate</text>

  <rect x="40" y="136" width="200" height="52" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="168" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Player probe</text>

  <path d="M240 90 C300 90, 320 118, 360 128" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <path d="M240 162 C300 162, 320 140, 360 134" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="360,131 348,125 348,137" fill="#94a3b8"/>

  <rect x="370" y="106" width="180" height="52" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="460" y="138" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Event health</text>

  <line x1="550" y1="132" x2="600" y2="132" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="600,132 588,126 588,138" fill="#94a3b8"/>

  <rect x="610" y="106" width="160" height="52" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="690" y="138" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Scenarios</text>

  <line x1="770" y1="132" x2="820" y2="132" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5"/>
  <polygon points="820,132 808,126 808,138" fill="#94a3b8"/>
  <rect x="762" y="78" width="66" height="20" rx="6" fill="#334155"/>
  <text x="795" y="92" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">parallel</text>

  <rect x="830" y="106" width="120" height="52" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="890" y="138" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Runbook</text>

  <text x="140" y="230" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">Can we ship?  Playback OK?</text>
  <text x="575" y="230" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">SLOs  devices  Healthy to Incident</text>
  <text x="890" y="230" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="middle">Coverage  escalate</text>
</svg>
